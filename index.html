<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="个人简历和作品展示" />
        <title>我的个人简历</title>
        <link rel="icon" type="image/svg+xml" href="assets/avatar.svg" />
        <link href="css/styles.css" rel="stylesheet" />
    </head>
    <body id="page-top">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="sideNav">
            <a class="navbar-brand js-scroll-trigger" href="#page-top">
                <span class="d-block d-lg-none">我的个人简历</span>
                <span class="d-none d-lg-block"><img class="img-fluid img-profile rounded-circle mx-auto mb-2" src="assets/avatar.svg" alt="" /></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="切换导航"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#about">个人简介</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#experience">经历</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#education">教育背景</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#skills">技能</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#projects">项目</a></li>
                </ul>
            </div>
        </nav>
        <main class="container-fluid p-0">
            <section class="resume-section" id="about">
                <div class="resume-section-content">
                    <h1 class="mb-3">你的<span class="text-primary">姓名</span></h1>
                    <p class="subheading mb-4">在这里填写你的职业方向或领域</p>
                    <p class="lead mb-4">用两三句话介绍自己，可以写你在做什么、擅长什么，以及希望通过这个主页展示什么。</p>
                    <a class="btn btn-outline-primary" href="#projects">查看项目</a>
                </div>
            </section>
            <hr class="m-0" />
            <section class="resume-section" id="experience">
                <div class="resume-section-content">
                    <h2 class="mb-4">经历</h2>
                    <div class="d-flex flex-column flex-md-row justify-content-between gap-3">
                        <div>
                            <h3 class="mb-2">岗位或职责</h3>
                            <p class="subheading mb-2">机构名称</p>
                            <p>写下你负责的工作，以及一个可以具体说明的成果。</p>
                        </div>
                        <p class="text-primary flex-shrink-0">开始时间 至 结束时间</p>
                    </div>
                </div>
            </section>
            <hr class="m-0" />
            <section class="resume-section" id="education">
                <div class="resume-section-content">
                    <h2 class="mb-4">教育背景</h2>
                    <h3 class="mb-2">学校名称</h3>
                    <p>填写专业、学位或与你的方向相关的学习经历。</p>
                </div>
            </section>
            <hr class="m-0" />
            <section class="resume-section" id="skills">
                <div class="resume-section-content">
                    <h2 class="mb-4">技能</h2>
                    <p>列出你能实际应用的工具、语言或专业技能。</p>
                </div>
            </section>
            <hr class="m-0" />
            <section class="resume-section" id="projects">
                <div class="resume-section-content">
                    <h2 class="mb-4">项目</h2>
                    <h3 class="mb-2">项目名称</h3>
                    <p>介绍项目解决的问题、你的贡献和结果。你可以在此添加作品或 GitHub 仓库链接。</p>
                </div>
            </section>
        </main>
        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
    </body>
</html>
